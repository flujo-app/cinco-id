<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinco Identity Generator 2.5</title>
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body>
  <div id="desktop">
    <div id="icons"></div>
    <div id="dim"></div>
  </div>
  <div id="start-menu" hidden>
    <div class="start-stripe"><span>CINCO ID</span></div>
    <div class="start-items">
      <button data-action="console">Computer</button>
      <button data-action="index">Choose a sequence</button>
      <button data-action="music">Music on / off</button>
      <button data-action="test-call">Test call</button>
      <hr>
      <button data-action="folder-projects">Projects folder</button>
      <button data-action="folder-printouts">Printouts folder</button>
      <button data-action="folder-music">Music folder</button>
      <button data-action="setup">Setup...</button>
      <hr>
      <button data-action="clear">Close all windows</button>
    </div>
  </div>
  <div id="taskbar">
    <div id="tasks"></div>
    <div id="tray">
      <button id="start">Menu</button>
      <button id="tray-mic" class="symbol" title="Hold to talk (or hold the space bar)">&#127908;</button>
      <button id="tray-mute" class="symbol" title="Sound on / off">&#128266;</button>
    </div>
  </div>
  <div id="scanlines"></div>
  <script type="module" src="/ui/main.js"></script>
</body>
</html>
